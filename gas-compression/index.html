<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قابلية المواد للانضغاط — محاكاة تفاعلية</title>
<meta name="description" content="محاكاة تفاعلية توضح لماذا تنضغط الغازات بينما لا تنضغط المواد الصلبة">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1e293b;
    --muted: #64748b;
    --card: #ffffff;
    --bg: #eef4fa;
    --accent: #0284c7;
    --accent-solid: #b45309;
    --ok: #059669;
    --warn: #dc2626;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Tajawal", "Segoe UI", Tahoma, Arial, sans-serif;
    background: linear-gradient(160deg, #eef4fa 0%, #e3edf7 100%);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 14px 10px 20px;
    -webkit-tap-highlight-color: transparent;
  }
  .card {
    width: 100%;
    max-width: 620px;
    background: var(--card);
    border-radius: 20px;
    box-shadow: 0 10px 34px rgba(15, 46, 82, 0.12);
    padding: 18px 18px 14px;
  }
  header { text-align: center; margin-bottom: 10px; }
  h1 {
    margin: 0 0 4px;
    font-size: clamp(20px, 4.6vw, 27px);
    font-weight: 800;
    color: #0f2e52;
  }
  .subtitle {
    margin: 0;
    color: var(--muted);
    font-size: clamp(13px, 3.2vw, 15px);
    font-weight: 500;
  }
  /* mode switch */
  .seg {
    display: flex;
    gap: 6px;
    background: #eaf1f8;
    border-radius: 14px;
    padding: 5px;
    margin: 12px auto 10px;
    max-width: 360px;
  }
  .seg-btn {
    flex: 1;
    border: 0;
    border-radius: 10px;
    padding: 10px 8px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    color: #47617e;
    background: transparent;
    cursor: pointer;
    transition: all .18s ease;
  }
  .seg-btn.active[data-mode="gas"] { background: var(--accent); color: #fff; box-shadow: 0 3px 10px rgba(2,132,199,.35); }
  .seg-btn.active[data-mode="solid"] { background: var(--accent-solid); color: #fff; box-shadow: 0 3px 10px rgba(180,83,9,.35); }
  /* canvas */
  .stage { display: flex; justify-content: center; }
  canvas {
    width: 100%;
    max-width: 480px;
    height: auto;
    display: block;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    border-radius: 14px;
  }
  /* controls */
  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 10px 0 12px;
  }
  .press-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 0;
    border-radius: 14px;
    padding: 13px 22px;
    font-family: inherit;
    font-size: 17px;
    font-weight: 800;
    color: #fff;
    background: linear-gradient(180deg, #ef4444, #dc2626);
    box-shadow: 0 4px 14px rgba(220,38,38,.35);
    cursor: pointer;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    transition: transform .1s ease;
  }
  .press-btn:active, .press-btn.holding { transform: translateY(3px); box-shadow: 0 2px 6px rgba(220,38,38,.35); }
  .press-btn svg { width: 20px; height: 20px; }
  .reset-btn {
    border: 2px solid #cbd8e6;
    background: #fff;
    color: #47617e;
    border-radius: 14px;
    padding: 11px 18px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .reset-btn:hover { background: #f3f7fb; }
  .volume-badge {
    background: #f0f7ff;
    border: 2px solid #cfe6fb;
    border-radius: 14px;
    padding: 10px 16px;
    font-size: 16px;
    font-weight: 700;
    color: #0c4a6e;
    min-width: 128px;
    text-align: center;
  }
  .volume-badge b { font-size: 19px; color: var(--accent); }
  body.solid .volume-badge { background: #fff8ef; border-color: #f3ddc0; color: #7c3d12; }
  body.solid .volume-badge b { color: var(--accent-solid); }
  /* explanation */
  .explain {
    border-radius: 14px;
    padding: 12px 16px;
    background: #f0f9ff;
    border-right: 5px solid var(--accent);
    transition: background .25s, border-color .25s;
    min-height: 88px;
  }
  .explain h2 { margin: 0 0 4px; font-size: 16.5px; font-weight: 800; color: #0c4a6e; }
  .explain p { margin: 0; font-size: 14.5px; line-height: 1.8; color: #33475c; font-weight: 500; }
  .explain.state-compressed { background: #ecfdf5; border-color: var(--ok); }
  .explain.state-compressed h2 { color: #065f46; }
  .explain.state-solid { background: #fffbeb; border-color: var(--accent-solid); }
  .explain.state-solid h2 { color: #92400e; }
  .explain.state-blocked { background: #fef2f2; border-color: var(--warn); }
  .explain.state-blocked h2 { color: #991b1b; }
  footer {
    text-align: center;
    margin-top: 12px;
    font-size: 12px;
    color: #94a3b8;
    font-weight: 500;
  }
</style>
</head>
<body>
<main class="card">
  <header>
    <h1>هل يمكن ضغط المادة؟</h1>
    <p class="subtitle">اضغط على المكبس (أو اسحبه للأسفل) ولاحظ ماذا يحدث للحجم</p>
  </header>

  <div class="seg" role="tablist" aria-label="اختيار الحالة">
    <button class="seg-btn active" data-mode="gas" role="tab" aria-selected="true">غاز</button>
    <button class="seg-btn" data-mode="solid" role="tab" aria-selected="false">مادة صلبة</button>
  </div>

  <div class="stage">
    <canvas id="cv" aria-label="محاكاة وعاء بمكبس يضغط على المادة"></canvas>
  </div>

  <div class="controls">
    <button class="press-btn" id="pressBtn" aria-label="اضغط مع الاستمرار لدفع المكبس للأسفل">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="12" y1="4" x2="12" y2="20"></line>
        <polyline points="5 13 12 20 19 13"></polyline>
      </svg>
      اضغط مع الاستمرار
    </button>
    <button class="reset-btn" id="resetBtn">إعادة</button>
    <div class="volume-badge">الحجم: <b id="volVal">100٪</b></div>
  </div>

  <div class="explain" id="explain">
    <h2 id="exTitle"></h2>
    <p id="exBody"></p>
  </div>

  <footer>محاكاة تفاعلية — منصة نصيحة التعليمية</footer>
</main>

<script>
(() => {
  "use strict";

  const cv = document.getElementById("cv");
  const ctx = cv.getContext("2d");
  const W = 560, H = 620;

  function fitCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    cv.width = W * dpr;
    cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  fitCanvas();
  window.addEventListener("resize", fitCanvas);

  // ---- Geometry (logical coordinates) ----
  const innerL = 140, innerR = 420, innerB = 560, rimY = 168;
  const wallT = 13, plateH = 16, rodW = 14, rodLen = 112, handleW = 150, handleH = 16;
  const innerW = innerR - innerL;
  const cx = (innerL + innerR) / 2;

  const GAS_REST = 192;               // piston plate bottom edge, gas at 100%
  const GAS_MAX = 432;                // most compressed position (~35%)
  const GAS_H0 = innerB - GAS_REST;

  // ---- Solid lattice (hexagonal close packing, particles touching) ----
  const SR = 12;                       // solid particle radius
  const solid = [];
  (function buildLattice() {
    const dx = SR * 2, dy = SR * 2 * Math.sin(Math.PI / 3);
    const rows = 10;
    const y0 = innerB - SR - 1;
    for (let r = 0; r < rows; r++) {
      const y = y0 - r * dy;
      const shift = (r % 2) * SR;
      for (let x = innerL + SR + 2 + shift; x <= innerR - SR - 2; x += dx) {
        solid.push({ x, y, ph: Math.random() * Math.PI * 2, ph2: Math.random() * Math.PI * 2, f: 5 + Math.random() * 3 });
      }
    }
  })();
  const solidTopY = Math.min(...solid.map(p => p.y)) - SR;
  const SOLID_REST = solidTopY - 1;    // plate rests directly on the solid block
  const SOLID_MAX = SOLID_REST + 3;    // barely budges (elastic, ~1%)

  // ---- Gas particles ----
  const GR = 7, GAS_N = 26;
  let gas = [];
  function initGas() {
    gas = [];
    for (let i = 0; i < GAS_N; i++) {
      const ang = Math.random() * Math.PI * 2;
      const sp = 55 + Math.random() * 60;
      gas.push({
        x: innerL + GR + 4 + Math.random() * (innerW - 2 * GR - 8),
        y: GAS_REST + GR + 6 + Math.random() * (innerB - GAS_REST - 2 * GR - 12),
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp,
        hue: 195 + Math.random() * 25,
      });
    }
  }
  initGas();

  // ---- State ----
  const state = {
    mode: "gas",             // "gas" | "solid"
    plateBot: GAS_REST,      // y of plate bottom edge
    pressing: false,         // button / key held
    dragging: false,
    dragWant: GAS_REST,      // where the pointer wants the plate
    attempting: false,       // any downward push this frame (drives arrows/messages)
    shake: 0,                // solid shake intensity
  };

  const restFor = m => (m === "gas" ? GAS_REST : SOLID_REST);
  const maxFor = m => (m === "gas" ? GAS_MAX : SOLID_MAX);

  function volumePercent() {
    if (state.mode === "solid") return 100;
    return ((innerB - state.plateBot) / GAS_H0) * 100;
  }

  // ---- Piston motion ----
  function updatePiston(dt) {
    const rest = restFor(state.mode), max = maxFor(state.mode);
    const before = state.plateBot;
    let wantsDown = false;

    if (state.dragging) {
      const target = Math.min(Math.max(state.dragWant, rest), max);
      wantsDown = state.dragWant > state.plateBot + 2;
      state.plateBot += (target - state.plateBot) * Math.min(1, dt * 14);
    } else if (state.pressing) {
      wantsDown = true;
      if (state.mode === "gas") {
        // harder to push as the gas compresses (pressure builds up)
        const frac = (state.plateBot - rest) / (max - rest);
        const speed = 175 * (1 - 0.62 * frac) + 12;
        state.plateBot = Math.min(max, state.plateBot + speed * dt);
      } else {
        state.plateBot = Math.min(max, state.plateBot + 26 * dt);
      }
    } else {
      // released: compressed matter pushes the piston back up
      state.plateBot += (rest - state.plateBot) * Math.min(1, dt * 3.2);
      if (Math.abs(state.plateBot - rest) < 0.4) state.plateBot = rest;
    }

    state.attempting = wantsDown;
    if (state.mode === "solid") {
      state.shake += ((wantsDown ? 1 : 0) - state.shake) * Math.min(1, dt * 8);
    } else {
      state.shake = 0;
    }
    return (state.plateBot - before) / Math.max(dt, 1e-4); // piston velocity (px/s)
  }

  // ---- Gas physics ----
  function updateGas(dt, pistonVel) {
    const top = state.plateBot;
    for (const p of gas) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.x < innerL + GR) { p.x = innerL + GR; p.vx = Math.abs(p.vx); }
      if (p.x > innerR - GR) { p.x = innerR - GR; p.vx = -Math.abs(p.vx); }
      if (p.y > innerB - GR) { p.y = innerB - GR; p.vy = -Math.abs(p.vy); }
      if (p.y < top + GR) {
        p.y = top + GR;
        p.vy = Math.abs(p.vy) + Math.max(0, pistonVel) * 0.35; // piston does work on the gas
      }
      // keep speeds in a sensible range
      const sp = Math.hypot(p.vx, p.vy);
      if (sp > 190) { p.vx *= 0.985; p.vy *= 0.985; }
      if (sp < 40) { p.vx *= 1.02; p.vy *= 1.02; }
    }
  }

  // ---- Drawing ----
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawArrow(x, yTop, yBot) {
    ctx.strokeStyle = "#e11d48";
    ctx.fillStyle = "#e11d48";
    ctx.lineWidth = 7;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(x, yTop);
    ctx.lineTo(x, yBot - 12);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x - 11, yBot - 14);
    ctx.lineTo(x + 11, yBot - 14);
    ctx.lineTo(x, yBot);
    ctx.closePath();
    ctx.fill();
  }

  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    const plateBot = state.plateBot;
    const plateTop = plateBot - plateH;
    const shakeX = state.mode === "solid" ? Math.sin(t * 42) * 1.6 * state.shake : 0;

    // container interior
    ctx.fillStyle = "#f4f8fc";
    ctx.fillRect(innerL, rimY, innerW, innerB - rimY);

    if (state.mode === "gas") {
      // gas sample tint
      ctx.fillStyle = "rgba(56, 189, 248, 0.13)";
      ctx.fillRect(innerL, plateBot, innerW, innerB - plateBot);

      // original-volume dashed marker
      ctx.strokeStyle = "rgba(100, 116, 139, 0.55)";
      ctx.lineWidth = 2;
      ctx.setLineDash([7, 6]);
      ctx.beginPath();
      ctx.moveTo(innerL + 2, GAS_REST);
      ctx.lineTo(innerR - 2, GAS_REST);
      ctx.stroke();
      ctx.setLineDash([]);
      if (plateBot > GAS_REST + 24) {
        ctx.fillStyle = "rgba(100,116,139,0.85)";
        ctx.font = "600 13px Tajawal, sans-serif";
        ctx.textAlign = "right";
        ctx.fillText("الحجم الأصلي", innerR - 8, GAS_REST + 17);
      }

      // volume % in the middle of the gas column
      const vol = Math.round(volumePercent());
      ctx.fillStyle = "rgba(2, 132, 199, 0.30)";
      ctx.font = "800 46px Tajawal, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(vol + "%", cx, (plateBot + innerB) / 2 + 4);
      ctx.textBaseline = "alphabetic";

      // particles
      for (const p of gas) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, GR, 0, Math.PI * 2);
        ctx.fillStyle = `hsl(${p.hue}, 85%, 45%)`;
        ctx.fill();
        ctx.beginPath();
        ctx.arc(p.x - 2, p.y - 2.5, GR * 0.32, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255,255,255,0.5)";
        ctx.fill();
      }
    } else {
      // solid block: tightly packed vibrating lattice
      const amp = 0.7 + state.shake * 0.9;
      for (const p of solid) {
        const x = p.x + Math.sin(t * p.f + p.ph) * amp + shakeX;
        const y = p.y + Math.cos(t * p.f + p.ph2) * amp;
        ctx.beginPath();
        ctx.arc(x, y, SR, 0, Math.PI * 2);
        ctx.fillStyle = "#f59e0b";
        ctx.fill();
        ctx.lineWidth = 1.6;
        ctx.strokeStyle = "#b45309";
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(x - 3, y - 3.5, SR * 0.3, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255,255,255,0.55)";
        ctx.fill();
      }
      // 100% label on the block
      ctx.font = "800 46px Tajawal, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.lineWidth = 6;
      ctx.strokeStyle = "rgba(255,255,255,0.75)";
      ctx.strokeText("100%", cx + shakeX, (solidTopY + innerB) / 2);
      ctx.fillStyle = "rgba(146, 64, 14, 0.85)";
      ctx.fillText("100%", cx + shakeX, (solidTopY + innerB) / 2);
      ctx.textBaseline = "alphabetic";
    }

    // piston (plate + rod + handle)
    const px = shakeX;
    ctx.fillStyle = "#2b3440";
    roundRect(innerL + 1.5 + px, plateTop, innerW - 3, plateH, 3);
    ctx.fill();
    ctx.fillStyle = "#46586c";
    ctx.fillRect(innerL + 1.5 + px, plateTop, innerW - 3, 4);
    ctx.fillStyle = "#2b3440";
    ctx.fillRect(cx - rodW / 2 + px, plateTop - rodLen, rodW, rodLen);
    roundRect(cx - handleW / 2 + px, plateTop - rodLen - handleH, handleW, handleH, 7);
    ctx.fill();

    // container walls (drawn over everything inside)
    ctx.fillStyle = "#39424e";
    roundRect(innerL - wallT, rimY, wallT, innerB - rimY + wallT, 4);
    ctx.fill();
    roundRect(innerR, rimY, wallT, innerB - rimY + wallT, 4);
    ctx.fill();
    ctx.fillRect(innerL - 4, innerB, innerW + 8, wallT);

    // force arrows while pushing
    if (state.attempting) {
      const yB = plateTop - 6;
      drawArrow(innerL + innerW * 0.26, yB - 40, yB);
      drawArrow(innerL + innerW * 0.74, yB - 40, yB);
    }

    // "does not compress" callout for the solid
    if (state.mode === "solid" && state.shake > 0.55) {
      ctx.font = "800 21px Tajawal, sans-serif";
      ctx.textAlign = "center";
      const msg = "لا ينضغط!";
      const mw = ctx.measureText(msg).width + 30;
      const bx = cx, by = rimY - 62;
      ctx.fillStyle = "#dc2626";
      roundRect(bx - mw / 2, by - 24, mw, 36, 10);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.fillText(msg, bx, by + 2);
    }
  }

  // ---- Explanation panel ----
  const exBox = document.getElementById("explain");
  const exTitle = document.getElementById("exTitle");
  const exBody = document.getElementById("exBody");
  const volVal = document.getElementById("volVal");
  let lastKey = "";

  function updatePanel() {
    const vol = volumePercent();
    volVal.textContent = Math.round(vol) + "٪";
    let key, title, body, cls;
    if (state.mode === "gas") {
      if (vol < 55) {
        key = "gas-full"; cls = "state-compressed";
        title = "انضغط الغاز!";
        body = "عدد الجسيمات لم يتغيّر، لكن الفراغات الكبيرة بينها قلّت كثيرًا فقلّ الحجم. لهذا الغازات قابلة للانضغاط. أفلت الزر ولاحظ كيف يدفع الغازُ المكبسَ للأعلى من جديد.";
      } else if (vol < 97) {
        key = "gas-part"; cls = "state-compressed";
        title = "الحجم يتناقص…";
        body = "المكبس يقترب والجسيمات تتزاحم في حجم أصغر. استمر بالضغط ولاحظ كم يمكن أن يقلّ الحجم!";
      } else {
        key = "gas-idle"; cls = "";
        title = "الغاز: جسيمات متباعدة وفراغات كبيرة";
        body = "جسيمات الغاز تتحرك بسرعة في جميع الاتجاهات، والمسافات بينها كبيرة جدًا. اضغط على المكبس وراقب الحجم.";
      }
    } else {
      if (state.shake > 0.4) {
        key = "solid-press"; cls = "state-blocked";
        title = "المادة الصلبة لا تنضغط!";
        body = "مهما ضغطت يبقى الحجم 100٪ تقريبًا، لأن الجسيمات متراصّة ومتلاصقة ولا توجد بينها فراغات كافية لتقترب أكثر من ذلك.";
      } else {
        key = "solid-idle"; cls = "state-solid";
        title = "المادة الصلبة: جسيمات متراصّة";
        body = "الجسيمات مرتّبة بانتظام ومتلاصقة، وتهتز في أماكنها فقط دون أن تنتقل. جرّب الضغط على المكبس وشاهد ماذا يحدث.";
      }
    }
    if (key !== lastKey) {
      lastKey = key;
      exTitle.textContent = title;
      exBody.textContent = body;
      exBox.className = "explain " + cls;
    }
  }

  // ---- Interaction ----
  const pressBtn = document.getElementById("pressBtn");
  const resetBtn = document.getElementById("resetBtn");

  function startPress() { state.pressing = true; pressBtn.classList.add("holding"); }
  function endPress() { state.pressing = false; pressBtn.classList.remove("holding"); }

  pressBtn.addEventListener("pointerdown", e => {
    e.preventDefault();
    try { pressBtn.setPointerCapture(e.pointerId); } catch (_) {}
    startPress();
  });
  pressBtn.addEventListener("pointerup", endPress);
  pressBtn.addEventListener("pointercancel", endPress);
  pressBtn.addEventListener("lostpointercapture", endPress);
  pressBtn.addEventListener("contextmenu", e => e.preventDefault());

  window.addEventListener("keydown", e => {
    if (e.code === "Space" || e.code === "ArrowDown") { e.preventDefault(); startPress(); }
  });
  window.addEventListener("keyup", e => {
    if (e.code === "Space" || e.code === "ArrowDown") endPress();
  });
  window.addEventListener("blur", () => { endPress(); state.dragging = false; });

  // drag the piston directly
  function canvasY(e) {
    const r = cv.getBoundingClientRect();
    return (e.clientY - r.top) * (H / r.height);
  }
  function canvasX(e) {
    const r = cv.getBoundingClientRect();
    return (e.clientX - r.left) * (W / r.width);
  }
  function hitsPiston(x, y) {
    const plateTop = state.plateBot - plateH;
    const pad = 14;
    const inHandle = Math.abs(x - cx) < handleW / 2 + pad && Math.abs(y - (plateTop - rodLen - handleH / 2)) < handleH + pad;
    const inRod = Math.abs(x - cx) < rodW / 2 + pad && y > plateTop - rodLen - pad && y < plateTop + pad;
    const inPlate = x > innerL - 4 && x < innerR + 4 && Math.abs(y - (plateTop + plateH / 2)) < plateH + pad;
    return inHandle || inRod || inPlate;
  }
  let dragOffset = 0;
  cv.addEventListener("pointerdown", e => {
    const x = canvasX(e), y = canvasY(e);
    if (hitsPiston(x, y)) {
      e.preventDefault();
      try { cv.setPointerCapture(e.pointerId); } catch (_) {}
      state.dragging = true;
      dragOffset = state.plateBot - y;
      state.dragWant = state.plateBot;
    }
  });
  cv.addEventListener("pointermove", e => {
    if (state.dragging) {
      state.dragWant = canvasY(e) + dragOffset;
    } else {
      cv.style.cursor = hitsPiston(canvasX(e), canvasY(e)) ? "grab" : "default";
    }
  });
  const endDrag = () => { state.dragging = false; };
  cv.addEventListener("pointerup", endDrag);
  cv.addEventListener("pointercancel", endDrag);
  cv.addEventListener("contextmenu", e => e.preventDefault());

  // mode switch + reset
  function setMode(mode) {
    state.mode = mode;
    state.plateBot = restFor(mode);
    state.pressing = false;
    state.dragging = false;
    state.shake = 0;
    if (mode === "gas") initGas();
    document.body.classList.toggle("solid", mode === "solid");
    document.querySelectorAll(".seg-btn").forEach(b => {
      const on = b.dataset.mode === mode;
      b.classList.toggle("active", on);
      b.setAttribute("aria-selected", on);
    });
    lastKey = "";
    updatePanel();
  }
  document.querySelectorAll(".seg-btn").forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));
  resetBtn.addEventListener("click", () => setMode(state.mode));

  // ---- Main loop ----
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    const t = now / 1000;
    const pv = updatePiston(dt);
    if (state.mode === "gas") updateGas(dt, pv);
    draw(t);
    updatePanel();
    requestAnimationFrame(frame);
  }
  setMode("gas");
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
