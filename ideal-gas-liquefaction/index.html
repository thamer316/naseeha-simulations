<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استحالة إسالة الغاز المثالي — محاكاة تفاعلية</title>
<meta name="description" content="محاكاة تفاعلية توضح لماذا لا يمكن إسالة الغاز المثالي مهما زاد الضغط أو انخفضت درجة الحرارة، بينما تسال الغازات الحقيقية">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1e293b;
    --muted: #64748b;
    --card: #ffffff;
    --accent: #0284c7;
    --ideal: #7c3aed;
  }
  * { box-sizing: border-box; }
  /* no inner scrollbar: the page is embedded in an iframe and the host site scrolls */
  html, body { margin: 0; padding: 0; overflow: hidden; }
  body {
    font-family: "Tajawal", "Segoe UI", Tahoma, Arial, sans-serif;
    background: linear-gradient(160deg, #eef4fa 0%, #e3edf7 100%);
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 10px 10px 12px;
    -webkit-tap-highlight-color: transparent;
  }
  .card {
    width: 100%;
    max-width: 620px;
    background: var(--card);
    border-radius: 20px;
    box-shadow: 0 10px 34px rgba(15, 46, 82, 0.12);
    padding: 18px 18px 14px;
  }
  header { text-align: center; margin-bottom: 10px; }
  h1 {
    margin: 0 0 4px;
    font-size: clamp(20px, 4.6vw, 27px);
    font-weight: 800;
    color: #0f2e52;
  }
  .subtitle {
    margin: 0;
    color: var(--muted);
    font-size: clamp(13px, 3.2vw, 15px);
    font-weight: 500;
  }
  /* canvas */
  .stage { display: flex; justify-content: center; }
  canvas {
    width: 100%;
    max-width: 430px;
    height: auto;
    display: block;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    border-radius: 14px;
  }
  /* controls */
  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 8px 0 2px;
  }
  .mode-seg {
    display: inline-flex;
    border: 2px solid #cbd8e6;
    border-radius: 14px;
    overflow: hidden;
    background: #fff;
  }
  .seg-btn {
    border: 0;
    background: transparent;
    padding: 11px 18px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 800;
    color: #47617e;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    transition: background .15s ease, color .15s ease;
  }
  #btnIdeal.active { background: linear-gradient(180deg, #8b5cf6, #7c3aed); color: #fff; }
  #btnReal.active { background: linear-gradient(180deg, #0ea5e9, #0284c7); color: #fff; }
  .reset-btn {
    border: 2px solid #cbd8e6;
    background: #fff;
    color: #47617e;
    border-radius: 14px;
    padding: 11px 18px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .reset-btn:hover { background: #f3f7fb; }
  /* temperature slider */
  .temp-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 6px 0 10px;
  }
  .t-label { font-size: 14px; font-weight: 800; }
  .t-label.hot { color: #dc2626; }
  .t-label.cold { color: #2563eb; }
  #tempSlider {
    -webkit-appearance: none;
    appearance: none;
    width: min(250px, 55vw);
    height: 30px;
    background: transparent;
    cursor: pointer;
    touch-action: none;
  }
  #tempSlider::-webkit-slider-runnable-track {
    height: 10px;
    border-radius: 6px;
    background: linear-gradient(90deg, #60a5fa 0%, #bfdbfe 40%, #fecaca 75%, #f87171 100%);
  }
  #tempSlider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #fff;
    border: 3px solid var(--accent);
    margin-top: -8px;
    box-shadow: 0 2px 6px rgba(15, 46, 82, 0.25);
  }
  #tempSlider::-moz-range-track {
    height: 10px;
    border-radius: 6px;
    background: linear-gradient(90deg, #60a5fa 0%, #bfdbfe 40%, #fecaca 75%, #f87171 100%);
  }
  #tempSlider::-moz-range-thumb {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #fff;
    border: 3px solid var(--accent);
    box-shadow: 0 2px 6px rgba(15, 46, 82, 0.25);
  }
  /* explanation */
  .explain {
    border-radius: 14px;
    padding: 12px 16px;
    background: #f0f9ff;
    border-right: 5px solid var(--accent);
    min-height: 132px;
    display: flex;
    align-items: center;
  }
  .explain p { margin: 0; font-size: 15px; line-height: 2; color: #33475c; font-weight: 500; }
  footer {
    text-align: center;
    margin-top: 8px;
    font-size: 12px;
    color: #94a3b8;
    font-weight: 500;
  }
</style>
</head>
<body>
<main class="card">
  <header>
    <h1>استحالة إسالة الغاز المثالي</h1>
    <p class="subtitle">برّد الغاز وزِد الضغط عليه بالمكبس… هل يتحوّل إلى سائل؟</p>
  </header>

  <div class="stage">
    <canvas id="cv" aria-label="محاكاة أسطوانة بمكبس فيها جسيمات غاز مع ترمومتر"></canvas>
  </div>

  <div class="controls">
    <div class="mode-seg" role="group" aria-label="نوع الغاز">
      <button type="button" class="seg-btn active" id="btnIdeal">غاز مثالي</button>
      <button type="button" class="seg-btn" id="btnReal">غاز حقيقي</button>
    </div>
    <button class="reset-btn" id="resetBtn">إعادة</button>
  </div>

  <div class="temp-wrap">
    <span class="t-label hot">ساخن</span>
    <input type="range" id="tempSlider" dir="ltr" min="0" max="100" value="78" aria-label="درجة الحرارة">
    <span class="t-label cold">بارد جداً</span>
  </div>

  <div class="explain">
    <p id="explainText"></p>
  </div>

  <footer>محاكاة تعليمية — منصة النصيحة التعليمية</footer>
</main>

<script>
(() => {
  "use strict";

  const cv = document.getElementById("cv");
  const ctx = cv.getContext("2d");
  const W = 560, H = 600;

  function fitCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    cv.width = W * dpr;
    cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  fitCanvas();
  window.addEventListener("resize", fitCanvas);

  // ---- Geometry (logical coordinates) ----
  const innerL = 150, innerR = 410, innerB = 520, rimY = 150;
  const wallT = 13, plateH = 16, rodW = 14, rodLen = 100, handleW = 150, handleH = 16;
  const innerW = innerR - innerL;
  const cx = (innerL + innerR) / 2;

  const REST = 176;                 // piston plate bottom edge, no applied pressure
  const MAX = 400;                  // most compressed position
  const POOL_MAX = 88;              // liquid pool height when fully condensed
  const GR = 6.5, N = 40;

  // ---- State ----
  const state = {
    mode: "ideal",        // "ideal" | "real"
    T: 0.78,              // hotness 0..1 (slider)
    plateBot: REST,       // piston stays where it is left
    dragging: false,
    dragWant: REST,
    keyDir: 0,            // -1 up / +1 down (arrow keys)
    condensed: 0,         // 0..1 fraction of gas turned liquid
    liqOn: false,         // hysteresis latch for liquefaction
    hasDragged: false,
    hintAlpha: 1,
  };

  const coldness = () => 1 - state.T;
  const pressureFrac = () => (state.plateBot - REST) / (MAX - REST);
  // cooling is essential, pressure helps (a gas above its critical
  // temperature cannot be liquefied by pressure alone)
  const liqScore = () => coldness() + 0.55 * pressureFrac();
  const poolH = () => state.condensed * POOL_MAX;
  const surfaceY = () => innerB - poolH();

  // ---- Particles ----
  const parts = [];
  function initParts() {
    parts.length = 0;
    for (let i = 0; i < N; i++) {
      const ang = Math.random() * Math.PI * 2;
      const sp = 120 + Math.random() * 90;
      parts.push({
        x: innerL + GR + 4 + Math.random() * (innerW - 2 * GR - 8),
        y: REST + GR + 6 + Math.random() * (innerB - REST - 2 * GR - 12),
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp,
        dh: (Math.random() - 0.5) * 26,
        wob: 0.85 + Math.random() * 0.3,
        st: "gas",          // "gas" | "fall" | "liq"
      });
    }
  }
  initParts();

  // ---- Frost decorations (precomputed) ----
  const icicles = [];
  (function buildIcicles() {
    let x = innerL - 6;
    while (x < innerR + 6) {
      icicles.push({ x, len: 12 + Math.random() * 22, w: 6 + Math.random() * 5 });
      x += 22 + Math.random() * 16;
    }
  })();
  const frostDots = [];
  (function buildFrostDots() {
    for (let i = 0; i < 16; i++) {
      const side = Math.random() < 0.5 ? innerL - wallT / 2 : innerR + wallT / 2;
      frostDots.push({
        x: side + (Math.random() - 0.5) * 10,
        y: 340 + Math.random() * 170,
        r: 1.5 + Math.random() * 2,
      });
    }
  })();
  const frost = () => Math.max(0, Math.min(1, (0.30 - state.T) / 0.30));

  // ---- Piston ----
  function updatePiston(dt) {
    const before = state.plateBot;
    if (state.dragging) {
      const target = Math.min(Math.max(state.dragWant, REST), MAX);
      state.plateBot += (target - state.plateBot) * Math.min(1, dt * 14);
    } else if (state.keyDir !== 0) {
      state.plateBot = Math.min(MAX, Math.max(REST, state.plateBot + state.keyDir * 190 * dt));
      state.hasDragged = true;
    }
    // no spring-back: sustained pressure is the point of this simulation
    return (state.plateBot - before) / Math.max(dt, 1e-4);
  }

  // ---- Condensation state machine ----
  function updateCondensation(dt) {
    if (state.mode === "real") {
      if (liqScore() >= 0.92) state.liqOn = true;
      else if (liqScore() <= 0.80) state.liqOn = false;
    } else {
      state.liqOn = false;
    }
    const target = state.liqOn ? 1 : 0;
    const rate = target > state.condensed ? 0.30 : (state.mode === "ideal" ? 1.6 : 0.5);
    if (state.condensed !== target) {
      const d = Math.sign(target - state.condensed) * rate * dt;
      state.condensed = Math.max(0, Math.min(1, state.condensed + d));
    }

    // keep ~15% of particles as vapour above the liquid
    const nCap = Math.round(N * 0.85 * state.condensed);
    let captured = parts.filter(p => p.st !== "gas").length;
    while (captured < nCap) {
      let pick = null;
      for (const p of parts) if (p.st === "gas" && (!pick || p.y > pick.y)) pick = p;
      if (!pick) break;
      pick.st = "fall";
      captured++;
    }
    while (captured > nCap) {
      let pick = null;
      for (const p of parts) if (p.st !== "gas" && (!pick || p.y < pick.y)) pick = p;
      if (!pick) break;
      pick.st = "gas";
      pick.vy = -(90 + Math.random() * 130);   // evaporation burst upward
      pick.vx = (Math.random() - 0.5) * 160;
      captured--;
    }
  }

  // ---- Gas physics ----
  const bonds = [];   // attraction lines drawn this frame (real gas only)

  function scatterBounce(p, nx, ny, extra) {
    const sp = Math.min(230, Math.max(30, Math.hypot(p.vx, p.vy)) + extra);
    const ang = Math.atan2(ny, nx) + (Math.random() - 0.5) * 2.5;
    p.vx = Math.cos(ang) * sp;
    p.vy = Math.sin(ang) * sp;
  }

  function updateParts(dt, pistonVel) {
    const top = state.plateBot;
    const surf = surfaceY();
    const liqTop = Math.min(surf + GR, innerB - GR);
    bonds.length = 0;

    // pairwise attraction between free particles (real gas only)
    if (state.mode === "real") {
      for (let i = 0; i < parts.length; i++) {
        const a = parts[i];
        if (a.st !== "gas") continue;
        for (let j = i + 1; j < parts.length; j++) {
          const b = parts[j];
          if (b.st !== "gas") continue;
          const dx = b.x - a.x, dy = b.y - a.y;
          const d = Math.hypot(dx, dy);
          if (d < 70 && d > 0.001) {
            // soft repulsion when overlapping, gentle attraction otherwise
            const f = d < 16 ? -130 * (1 - d / 16) : 26 * (1 - d / 70);
            const ax = (dx / d) * f * dt, ay = (dy / d) * f * dt;
            a.vx += ax; a.vy += ay;
            b.vx -= ax; b.vy -= ay;
            if (d < 64 && d > 14) bonds.push([a.x, a.y, b.x, b.y, 1 - d / 64]);
          }
        }
      }
    }

    for (const p of parts) {
      if (p.st === "gas") {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        if (p.x < innerL + GR) { p.x = innerL + GR; scatterBounce(p, 1, 0, 0); }
        if (p.x > innerR - GR) { p.x = innerR - GR; scatterBounce(p, -1, 0, 0); }
        if (p.y > surf - GR)   { p.y = surf - GR;   scatterBounce(p, 0, -1, 0); }
        if (p.y < top + GR) {
          p.y = top + GR;
          scatterBounce(p, 0, 1, Math.max(0, pistonVel) * 0.35); // piston does work on the gas
        }
        // relax speed toward the temperature target: cooling visibly slows the motion
        const sp = Math.hypot(p.vx, p.vy) || 1;
        const tgt = (36 + 195 * state.T) * p.wob;
        const ns = sp + (tgt - sp) * Math.min(1, dt * 1.4);
        p.vx *= ns / sp;
        p.vy *= ns / sp;
      } else if (p.st === "fall") {
        p.vy += 430 * dt;
        p.vx *= Math.max(0, 1 - 2.5 * dt);
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        if (p.x < innerL + GR) { p.x = innerL + GR; p.vx = Math.abs(p.vx); }
        if (p.x > innerR - GR) { p.x = innerR - GR; p.vx = -Math.abs(p.vx); }
        if (p.y >= liqTop) {
          p.y = liqTop;
          p.st = "liq";
          const ang = Math.random() * Math.PI * 2;
          p.vx = Math.cos(ang) * 11;
          p.vy = Math.sin(ang) * 11;
        }
      } else {
        // slow drift inside the liquid: particles are close together but still moving
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        const sp = Math.hypot(p.vx, p.vy) || 1;
        const tgt = 11 * p.wob;
        const ns = sp + (tgt - sp) * Math.min(1, dt * 2);
        p.vx *= ns / sp;
        p.vy *= ns / sp;
        if (p.x < innerL + GR) { p.x = innerL + GR; p.vx = Math.abs(p.vx); }
        if (p.x > innerR - GR) { p.x = innerR - GR; p.vx = -Math.abs(p.vx); }
        if (p.y < liqTop)      { p.y = liqTop;      p.vy = Math.abs(p.vy); }
        if (p.y > innerB - GR) { p.y = innerB - GR; p.vy = -Math.abs(p.vy); }
      }
    }
  }

  // ---- Wall droplets while condensing ----
  const drops = [];
  let dropTimer = 0;
  function updateDrops(dt) {
    const active = state.mode === "real" && state.liqOn &&
                   state.condensed > 0.04 && state.condensed < 0.985;
    dropTimer -= dt;
    if (active && dropTimer <= 0 && drops.length < 10) {
      drops.push({
        x: Math.random() < 0.5 ? innerL + 5.5 : innerR - 5.5,
        y: 210 + Math.random() * 180,
        r: 3 + Math.random() * 2.5,
        v: 25 + Math.random() * 35,
      });
      dropTimer = 0.33;
    }
    for (let i = drops.length - 1; i >= 0; i--) {
      const d = drops[i];
      d.v += 60 * dt;
      d.y += d.v * dt;
      if (d.y >= surfaceY() - 4) drops.splice(i, 1);
    }
    if (!active && state.condensed <= 0.02) drops.length = 0;
  }

  // ---- Drawing helpers ----
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawCallout(msg, color) {
    ctx.font = "800 21px Tajawal, sans-serif";
    ctx.textAlign = "center";
    const mw = ctx.measureText(msg).width + 30;
    const bx = cx, by = rimY - 62;
    ctx.fillStyle = color;
    roundRect(bx - mw / 2, by - 24, mw, 36, 10);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.fillText(msg, bx, by + 2);
  }

  function drawSnowflake(x, y, r, rot, alpha) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.strokeStyle = `rgba(147, 197, 253, ${alpha})`;
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    for (let i = 0; i < 6; i++) {
      const a = (i * Math.PI) / 3;
      const ux = Math.cos(a), uy = Math.sin(a);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(ux * r, uy * r);
      ctx.stroke();
      const bx = ux * r * 0.55, by = uy * r * 0.55;
      const a2 = a + Math.PI / 5, a3 = a - Math.PI / 5;
      ctx.beginPath();
      ctx.moveTo(bx, by);
      ctx.lineTo(bx + Math.cos(a2) * r * 0.3, by + Math.sin(a2) * r * 0.3);
      ctx.moveTo(bx, by);
      ctx.lineTo(bx + Math.cos(a3) * r * 0.3, by + Math.sin(a3) * r * 0.3);
      ctx.stroke();
    }
    ctx.restore();
  }

  function mercuryColor() {
    const T = state.T;
    const r = Math.round(59 + (239 - 59) * T);
    const g = Math.round(130 + (68 - 130) * T);
    const b = Math.round(246 + (68 - 246) * T);
    return `rgb(${r}, ${g}, ${b})`;
  }

  function drawThermometer() {
    const x = 80, tubeW = 13, top = 200, bot = 472, bulbY = 486, bulbR = 14;
    ctx.fillStyle = "#f1f5f9";
    roundRect(x - tubeW / 2, top, tubeW, bot - top, tubeW / 2);
    ctx.fill();
    ctx.strokeStyle = "#94a3b8";
    ctx.lineWidth = 2;
    roundRect(x - tubeW / 2, top, tubeW, bot - top, tubeW / 2);
    ctx.stroke();
    // mercury
    const level = bot - 6 - (bot - 6 - (top + 8)) * state.T;
    ctx.fillStyle = mercuryColor();
    ctx.fillRect(x - 3.5, level, 7, bot - level);
    ctx.beginPath();
    ctx.arc(x, bulbY, bulbR, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#94a3b8";
    ctx.stroke();
    // ticks
    ctx.strokeStyle = "#94a3b8";
    ctx.lineWidth = 1.5;
    for (let i = 0; i <= 4; i++) {
      const y = top + 14 + ((bot - top - 28) * i) / 4;
      ctx.beginPath();
      ctx.moveTo(x + tubeW / 2 + 2, y);
      ctx.lineTo(x + tubeW / 2 + 8, y);
      ctx.stroke();
    }
    ctx.fillStyle = "#64748b";
    ctx.font = "700 13px Tajawal, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("الحرارة", x, 188);
  }

  function drawFrost(t) {
    const f = frost();
    if (f < 0.02) return;
    // cold glow under the base
    ctx.fillStyle = `rgba(147, 197, 253, ${0.30 * f})`;
    ctx.beginPath();
    ctx.ellipse(cx, innerB + wallT + 12, innerW / 2 + 42, 24, 0, 0, Math.PI * 2);
    ctx.fill();
    // bluish tint over the walls
    ctx.fillStyle = `rgba(147, 197, 253, ${0.28 * f})`;
    roundRect(innerL - wallT, rimY, wallT, innerB - rimY + wallT, 4);
    ctx.fill();
    roundRect(innerR, rimY, wallT, innerB - rimY + wallT, 4);
    ctx.fill();
    ctx.fillRect(innerL - 4, innerB, innerW + 8, wallT);
    // frost line along the base
    ctx.strokeStyle = `rgba(224, 242, 254, ${0.9 * f})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(innerL - 8, innerB + wallT);
    ctx.lineTo(innerR + 8, innerB + wallT);
    ctx.stroke();
    // icicles growing under the base
    for (const ic of icicles) {
      const len = ic.len * f;
      ctx.fillStyle = "rgba(224, 242, 254, 0.92)";
      ctx.strokeStyle = `rgba(147, 197, 253, ${0.9 * f})`;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(ic.x - ic.w / 2, innerB + wallT);
      ctx.lineTo(ic.x + ic.w / 2, innerB + wallT);
      ctx.lineTo(ic.x, innerB + wallT + len);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }
    // frost specks on the outer walls
    for (const d of frostDots) {
      ctx.fillStyle = `rgba(240, 249, 255, ${0.75 * f})`;
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fill();
    }
    drawSnowflake(112, 552, 10, t * 0.15, 0.9 * f);
    drawSnowflake(452, 548, 11, -t * 0.12, 0.9 * f);
  }

  function drawPool(t) {
    const ph = poolH();
    if (ph < 2.5) return;
    const surf = innerB - ph;
    const wamp = Math.min(1, ph / 20);
    const wave = x => surf + (Math.sin(x * 0.045 + t * 2.1) * 2.2 + Math.sin(x * 0.02 - t * 1.3) * 1.5) * wamp;
    ctx.beginPath();
    ctx.moveTo(innerL, innerB);
    ctx.lineTo(innerL, wave(innerL));
    for (let x = innerL + 10; x < innerR; x += 10) ctx.lineTo(x, wave(x));
    ctx.lineTo(innerR, wave(innerR));
    ctx.lineTo(innerR, innerB);
    ctx.closePath();
    const g = ctx.createLinearGradient(0, surf, 0, innerB);
    g.addColorStop(0, "rgba(125, 211, 252, 0.55)");
    g.addColorStop(1, "rgba(2, 132, 199, 0.72)");
    ctx.fillStyle = g;
    ctx.fill();
    // bright animated surface line
    ctx.strokeStyle = "rgba(240, 249, 255, 0.85)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(innerL, wave(innerL));
    for (let x = innerL + 10; x <= innerR; x += 10) ctx.lineTo(Math.min(x, innerR), wave(Math.min(x, innerR)));
    ctx.stroke();
    // sheen
    ctx.fillStyle = "rgba(255, 255, 255, 0.16)";
    ctx.beginPath();
    ctx.ellipse(innerL + 72, surf + Math.min(20, ph * 0.4), 40, 7, -0.15, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawHint(t) {
    if (state.hasDragged) state.hintAlpha = Math.max(0, state.hintAlpha - 0.08);
    if (state.hintAlpha <= 0.01) return;
    const msg = "اسحب المكبس";
    ctx.font = "700 14px Tajawal, sans-serif";
    ctx.textAlign = "center";
    const wTxt = ctx.measureText(msg).width;
    const bw = wTxt + 40, bh = 30;
    const bx = 452, by = 52 + Math.sin(t * 2.5) * 3;
    ctx.globalAlpha = state.hintAlpha;
    ctx.fillStyle = "rgba(15, 46, 82, 0.88)";
    roundRect(bx - bw / 2, by - bh / 2, bw, bh, 9);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.fillText(msg, bx + 7, by + 5);
    // small down arrow inside the pill
    const ax = bx - wTxt / 2 - 6;
    ctx.strokeStyle = "#fff";
    ctx.fillStyle = "#fff";
    ctx.lineWidth = 2.5;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(ax, by - 8);
    ctx.lineTo(ax, by + 4);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(ax - 5, by + 2);
    ctx.lineTo(ax + 5, by + 2);
    ctx.lineTo(ax, by + 9);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    const plateBot = state.plateBot;
    const plateTop = plateBot - plateH;
    const isReal = state.mode === "real";
    const baseHue = isReal ? 199 : 258;

    // container interior + gas sample tint
    ctx.fillStyle = "#f4f8fc";
    ctx.fillRect(innerL, rimY, innerW, innerB - rimY);
    ctx.fillStyle = isReal ? "rgba(56, 189, 248, 0.12)" : "rgba(139, 92, 246, 0.10)";
    ctx.fillRect(innerL, plateBot, innerW, innerB - plateBot);

    drawPool(t);

    // attraction lines (the invisible difference this lesson is about)
    for (const b of bonds) {
      ctx.strokeStyle = `rgba(2, 132, 199, ${0.5 * b[4]})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(b[0], b[1]);
      ctx.lineTo(b[2], b[3]);
      ctx.stroke();
    }

    // particles: dimmed inside the liquid, full colour in the gas phase
    for (const p of parts) {
      ctx.globalAlpha = p.st === "liq" ? 0.45 : 1;
      ctx.beginPath();
      ctx.arc(p.x, p.y, GR, 0, Math.PI * 2);
      ctx.fillStyle = `hsl(${baseHue + p.dh}, 82%, ${p.st === "liq" ? 38 : 46}%)`;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(p.x - 2, p.y - 2.5, GR * 0.32, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,255,255,0.5)";
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // condensation droplets sliding down the walls
    for (const d of drops) {
      ctx.fillStyle = "rgba(56, 189, 248, 0.85)";
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(d.x, d.y - d.r * 0.9, d.r * 0.55, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.5)";
      ctx.beginPath();
      ctx.arc(d.x - d.r * 0.3, d.y - d.r * 0.3, d.r * 0.3, 0, Math.PI * 2);
      ctx.fill();
    }

    // piston (plate + rod + handle)
    ctx.fillStyle = "#2b3440";
    roundRect(innerL + 1.5, plateTop, innerW - 3, plateH, 3);
    ctx.fill();
    ctx.fillStyle = "#46586c";
    ctx.fillRect(innerL + 1.5, plateTop, innerW - 3, 4);
    ctx.fillStyle = "#2b3440";
    ctx.fillRect(cx - rodW / 2, plateTop - rodLen, rodW, rodLen);
    roundRect(cx - handleW / 2, plateTop - rodLen - handleH, handleW, handleH, 7);
    ctx.fill();

    // container walls
    ctx.fillStyle = "#39424e";
    roundRect(innerL - wallT, rimY, wallT, innerB - rimY + wallT, 4);
    ctx.fill();
    roundRect(innerR, rimY, wallT, innerB - rimY + wallT, 4);
    ctx.fill();
    ctx.fillRect(innerL - 4, innerB, innerW + 8, wallT);

    drawFrost(t);
    drawThermometer();
    drawHint(t);

    // state callouts
    if (!isReal && (coldness() >= 0.9 || pressureFrac() >= 0.9 || liqScore() >= 0.92)) {
      drawCallout("لا يمكن إسالة الغاز المثالي!", "#dc2626");
    } else if (isReal && state.condensed >= 0.45) {
      drawCallout("يمكن إسالة الغاز الحقيقي!", "#059669");
    }
  }

  // ---- Explanation box ----
  const explainEl = document.getElementById("explainText");
  const TEXTS = {
    ib: "الغازُ المثاليُّ غازٌ افتراضيٌّ قوى التجاذُب بين جُسيماته معدومة. برِّد الغازَ من شريط درجة الحرارة، وزِد الضغطَ عليه بسحب المكبس إلى الأسفل، ولاحظ: هل يتحوّل إلى سائل؟",
    ie: "مهما اشتدَّت البرودةُ أو علا الضغطُ تبقى جُسيماتُ الغاز المثاليّ متباعدةً حرّةَ الحركة؛ إذ لا توجد بينها قوى تجاذُبٍ تجمعُها؛ لذلك لا يمكن إسالةُ الغاز المثاليّ مهما زاد الضغطُ المؤثِّرُ فيه أو انخفضت درجةُ حرارته.",
    rb: "الغازُ الحقيقيُّ توجد بين جُسيماته قوى تجاذُبٍ ضعيفة (لاحظ الخطوط بين الجُسيمات المتقاربة). برِّد الغازَ وزِد الضغطَ عليه بالمكبس، ولاحظ ما يحدث لجُسيماته.",
    rl: "بخفض درجة الحرارة تقلُّ حركةُ الجُسيمات، وبزيادة الضغط تتقارب؛ فتتغلَّبُ قوى التجاذُب عليها وتتجمَّعُ الجُسيماتُ سائلًا؛ لذلك يمكن إسالةُ الغازات الحقيقية بخفض درجة الحرارة وزيادة الضغط.",
  };
  let explainKey = "";
  function updateExplain() {
    const extreme = coldness() >= 0.9 || pressureFrac() >= 0.9 || liqScore() >= 0.92;
    const key = state.mode === "ideal" ? (extreme ? "ie" : "ib")
                                       : (state.condensed >= 0.45 ? "rl" : "rb");
    if (key !== explainKey) {
      explainKey = key;
      explainEl.textContent = TEXTS[key];
    }
  }

  // ---- Interaction ----
  const btnIdeal = document.getElementById("btnIdeal");
  const btnReal = document.getElementById("btnReal");
  const resetBtn = document.getElementById("resetBtn");
  const tempSlider = document.getElementById("tempSlider");

  // switching modes keeps temperature and pressure: same conditions, different gas
  function setMode(m) {
    state.mode = m;
    btnIdeal.classList.toggle("active", m === "ideal");
    btnReal.classList.toggle("active", m === "real");
  }
  btnIdeal.addEventListener("click", () => setMode("ideal"));
  btnReal.addEventListener("click", () => setMode("real"));

  tempSlider.addEventListener("input", () => { state.T = tempSlider.value / 100; });

  function resetAll() {
    setMode("ideal");
    state.T = 0.78;
    tempSlider.value = 78;
    state.plateBot = REST;
    state.dragWant = REST;
    state.dragging = false;
    state.keyDir = 0;
    state.condensed = 0;
    state.liqOn = false;
    drops.length = 0;
    initParts();
  }
  resetBtn.addEventListener("click", resetAll);

  // drag the piston directly (it stays where you leave it)
  function canvasY(e) {
    const r = cv.getBoundingClientRect();
    return (e.clientY - r.top) * (H / r.height);
  }
  function canvasX(e) {
    const r = cv.getBoundingClientRect();
    return (e.clientX - r.left) * (W / r.width);
  }
  function hitsPiston(x, y) {
    const plateTop = state.plateBot - plateH;
    const pad = 14;
    const inHandle = Math.abs(x - cx) < handleW / 2 + pad && Math.abs(y - (plateTop - rodLen - handleH / 2)) < handleH + pad;
    const inRod = Math.abs(x - cx) < rodW / 2 + pad && y > plateTop - rodLen - pad && y < plateTop + pad;
    const inPlate = x > innerL - 4 && x < innerR + 4 && Math.abs(y - (plateTop + plateH / 2)) < plateH + pad;
    return inHandle || inRod || inPlate;
  }
  let dragOffset = 0;
  cv.addEventListener("pointerdown", e => {
    const x = canvasX(e), y = canvasY(e);
    if (hitsPiston(x, y)) {
      e.preventDefault();
      try { cv.setPointerCapture(e.pointerId); } catch (_) {}
      state.dragging = true;
      state.hasDragged = true;
      dragOffset = state.plateBot - y;
      state.dragWant = state.plateBot;
    }
  });
  cv.addEventListener("pointermove", e => {
    if (state.dragging) {
      state.dragWant = canvasY(e) + dragOffset;
    } else {
      cv.style.cursor = hitsPiston(canvasX(e), canvasY(e)) ? "grab" : "default";
    }
  });
  const endDrag = () => { state.dragging = false; };
  cv.addEventListener("pointerup", endDrag);
  cv.addEventListener("pointercancel", endDrag);
  cv.addEventListener("contextmenu", e => e.preventDefault());

  // arrow keys move the piston too (skip when the slider has focus)
  window.addEventListener("keydown", e => {
    if (document.activeElement === tempSlider) return;
    if (e.code === "ArrowDown") { e.preventDefault(); state.keyDir = 1; }
    if (e.code === "ArrowUp")   { e.preventDefault(); state.keyDir = -1; }
  });
  window.addEventListener("keyup", e => {
    if (e.code === "ArrowDown" && state.keyDir === 1) state.keyDir = 0;
    if (e.code === "ArrowUp" && state.keyDir === -1) state.keyDir = 0;
  });
  window.addEventListener("blur", () => { state.keyDir = 0; state.dragging = false; });

  // debug/inspection hook
  window.__sim = { state, parts, setMode, resetAll };

  // ---- Main loop ----
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    const t = now / 1000;
    const pv = updatePiston(dt);
    updateCondensation(dt);
    updateParts(dt, pv);
    updateDrops(dt);
    updateExplain();
    draw(t);
    requestAnimationFrame(frame);
  }
  updateExplain();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
