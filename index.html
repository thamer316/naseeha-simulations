<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محاكيات نصيحة التفاعلية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Tajawal", "Segoe UI", Tahoma, Arial, sans-serif;
    background: linear-gradient(160deg, #eef4fa 0%, #e3edf7 100%);
    color: #1e293b;
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px;
  }
  h1 { color: #0f2e52; font-size: 26px; margin: 0 0 6px; }
  p.sub { color: #64748b; margin: 0 0 28px; font-weight: 500; }
  .list { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 14px; }
  a.sim {
    display: block;
    background: #fff;
    border-radius: 16px;
    padding: 18px 22px;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 6px 20px rgba(15,46,82,.10);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  a.sim:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(15,46,82,.16); }
  a.sim h2 { margin: 0 0 4px; font-size: 18px; color: #0284c7; }
  a.sim p { margin: 0; font-size: 14px; color: #64748b; font-weight: 500; }
</style>
</head>
<body>
  <h1>محاكيات نصيحة التفاعلية</h1>
  <p class="sub">محاكيات تعليمية بسيطة للاستخدام داخل الدروس</p>
  <div class="list">
    <a class="sim" href="./gas-compression/">
      <h2>هل يمكن ضغط المادة؟</h2>
      <p>وعاء بمكبس يوضح قابلية الغازات للانضغاط مقابل المواد الصلبة المتراصّة</p>
    </a>
  </div>
</body>
</html>
